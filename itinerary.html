<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thrillin.go | Destination Itinerary</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Boxicons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    
    <style>
        #itinerary-hero {
            padding: 150px 0 50px 0;
            text-align: center;
        }
        #itinerary-content {
            padding: 50px 0 100px 0;
            min-height: 70vh;
        }
        .pdf-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            height: 85vh;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #1a1a1a;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .pdf-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .pdf-download-link {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        .pdf-download-link a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--gradient-brand);
            color: #fff;
            padding: 14px 30px;
            border-radius: 30px;
            font-weight: 700;
            font-family: var(--font-heading);
            font-size: 1rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .pdf-download-link a:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(14, 165, 233, 0.4);
        }
        @media(max-width: 768px) {
            .pdf-container {
                height: auto;
                min-height: 0;
                background: transparent;
                border: none;
                box-shadow: none;
            }
            .pdf-container iframe {
                display: none;
            }
            .pdf-download-link {
                display: block;
            }
            .pdf-page-images {
                display: flex;
                flex-direction: column;
                gap: 4px;
            }
            .pdf-page-images img {
                width: 100%;
                border-radius: 8px;
                display: block;
            }
            #itinerary-content {
                padding-bottom: 220px !important;
            }
            footer {
                padding-bottom: 120px !important;
            }
        }
        
        /* For Phuket Text */
        .text-itinerary {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(25, 25, 25, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 40px;
            text-align: left;
            line-height: 1.8;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }
        .text-itinerary h3 {
            color: var(--color-accent);
            margin-top: 30px;
            margin-bottom: 10px;
        }
        .text-itinerary ul {
            list-style: none;
        }
        .text-itinerary ul li {
            margin-bottom: 10px;
            padding-left: 20px;
            position: relative;
        }
        .text-itinerary ul li::before {
            content: '•';
            color: var(--color-accent);
            position: absolute;
            left: 0;
            font-weight: bold;
        }
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 30px;
            color: #fff;
            text-decoration: none;
            transition: color 0.3s;
        }
        .btn-back:hover {
            color: var(--color-accent);
        }
    </style>
</head>
<body>
    <!-- Cursor Glow Aura -->
    <div class="cursor-glow"></div>

    <!-- Background Orbs -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <!-- Navbar -->

            </div>
            <a href="index.html#contact" class="btn-primary hover-target magnetic-btn">Start Journey</a>
        </div>
    </nav>

    <section id="itinerary-hero">
        <div class="section-container">
            <a href="index.html#destinations" class="btn-back hover-target"><i class='bx bx-left-arrow-alt'></i> Back to Destinations</a>
            <p class="eyebrow reveal">Detailed Itinerary</p>
            <h1 id="dest-title" class="reveal delay-1">Loading...</h1>
            <p id="dest-price" class="subtitle reveal delay-2"></p>
            <div style="margin-top: 20px;" class="reveal delay-2">
                <a id="book-btn-top" href="https://wa.me/918200061818" target="_blank" class="btn-primary hover-target magnetic-btn">Book This Trip <i class='bx bxl-whatsapp'></i></a>
            </div>
        </div>
    </section>

    <section id="itinerary-content">
        <div class="section-container text-center reveal delay-3">
            <div id="content-area">
                <!-- Content will be injected here via JS -->
                <div class="spinner" style="display:inline-block; position:relative; left:0; top:0; transform:none;"><div class="double-bounce1"></div><div class="double-bounce2"></div></div>
            </div>
            
            <div style="margin-top: 50px;">
                <a id="book-btn" href="https://wa.me/918200061818" target="_blank" class="btn-primary hover-target magnetic-btn">Book This Trip <i class='bx bxl-whatsapp'></i></a>
            </div>
        </div>
    </section>

    <footer>
        <div class="footer-bottom" style="margin-top:0;">
            <p>&copy; 2026 Thrillin.go. Built for the thrill-seekers.</p>
        </div>
    </footer>

    <!-- Custom JS -->
    <script src="script.js"></script>
    <script>

            'rajasthan': { title: 'Rajasthan', price: 'From ₹5,000', type: 'pdf', file: 'assets/pdfs/rajasthan.pdf', pages: 7 },
            'kedarnath': {

                        <p><strong>Day 5: Darshan & Return Trek</strong></p>

                            <li>Return trek to Gaurikund and drive back to Guptkashi.</li></ul>

                        <p><strong>Day 6: Rishikesh to Haridwar</strong></p>
                        <ul><li>Drive to Rishikesh. Visit Ram Jhula, Lakshman Jhula, and Triveni Ghat. Return to Haridwar.</li></ul>

                        <p><strong>Day 7: Departure</strong></p>
                        <ul><li>Check-out and departure.</li></ul>

                        <h3>✅ Inclusions</h3>
                        <ul>
                            <li>4 Breakfasts, 3 Dinners (Veg)</li>

                        <h3>❌ Exclusions</h3>

                            <li>Pony/Palki/Helicopter charges</li>

                    </div>
                `
            },
            'spiti': { 
                title: 'Spiti Valley', 
                price: 'From ₹20,500', 
                type: 'text',
                content: `
                    <div class="text-itinerary">
                        <h3>Trip Overview</h3>
                        <p><strong>Duration:</strong> 9 Nights / 10 Days</p>
                        <p><strong>Package:</strong> Spiti Valley Winter/Summer Adventure</p>

                        <h3>🏨 Day-wise Itinerary</h3>
                        <p><strong>Day 0 & Day 1: Delhi to Shimla</strong></p>
                        <ul><li>Departure from hometown to Delhi.</li>
                            <li>Delhi to Shimla. Evening free at Mall Road.</li></ul>

                        <p><strong>Day 2: Shimla to Sangla</strong></p>
                        <ul><li>Drive via Narkanda and Sarahan.</li></ul>

                        <ul><li>Kaza to Chandratal Lake via Kunzum Pass. Camping at Chandratal.</li></ul>

                        <p><strong>Day 8: Chandratal to Manali</strong></p>
                        <ul><li>Chandratal to Manali via Rohtang Pass/Atal Tunnel.</li></ul>

                        <p><strong>Day 9 & Day 10: Manali & Return</strong></p>
                        <ul><li>Manali Local sightseeing (Hadimba Temple, Old Manali). Evening departure to Delhi.</li>
                            <li>Day 10: Arrival in Delhi.</li></ul>
                    </div>
                `
            },
            'zanskar': { 
                title: 'Zanskar Valley', 
                price: 'From ₹22,799', 
                type: 'text',
                content: `
                    <div class="text-itinerary">
                        <h3>Trip Overview</h3>
                        <p><strong>Duration:</strong> 6 Nights / 7 Days</p>

            },
            'hampta': { 
                title: 'Hampta Pass Trek', 
                price: 'From ₹6,499', 
                type: 'text',
                content: `
                    <div class="text-itinerary">
                        <h3>Trip Overview</h3>
                        <p><strong>Duration:</strong> 5 Days / 4 Nights</p>
                        <p><strong>Max Altitude:</strong> 14,010 Ft. | <strong>Trek Distance:</strong> 26 km</p>

        const urlParams = new URLSearchParams(window.location.search);
        const destId = urlParams.get('dest');
        const contentArea = document.getElementById('content-area');
        const titleEl = document.getElementById('dest-title');
        const priceEl = document.getElementById('dest-price');

        if (destId && destinations[destId]) {
            const dest = destinations[destId];
            titleEl.innerHTML = dest.title;
            priceEl.innerHTML = dest.price;
            
            const bookBtn = document.getElementById('book-btn');
            if (bookBtn) {
                bookBtn.href = `https://wa.me/918200061818?text=Hello,%20I'm%20interested%20in%20booking%20the%20${encodeURIComponent(dest.title)}%20package!`;
            }

            const bookBtnTop = document.getElementById('book-btn-top');
            if (bookBtnTop) {
                bookBtnTop.href = `https://wa.me/918200061818?text=Hello,%20I'm%20interested%20in%20booking%20the%20${encodeURIComponent(dest.title)}%20package!`;
            }
            
            if (dest.type === 'pdf') {
                // Build mobile page images HTML
                let mobileImagesHtml = '';
                const imgKey = dest.imageKey || destId;
                if (dest.pages) {
                    for (let i = 0; i < dest.pages; i++) {
                        mobileImagesHtml += `<img src="assets/pdf-pages/${imgKey}_page_${i}.png" alt="${dest.title} Page ${i+1}" loading="lazy">`;
                    }
                }
                contentArea.innerHTML = `<div class="pdf-wrapper">
                        <div class="pdf-container">
                            <iframe src="${dest.file}#toolbar=0&navpanes=0&scrollbar=0&view=FitH" title="${dest.title} Itinerary"></iframe>
                            <div class="pdf-page-images">${mobileImagesHtml}</div>
                        </div>
                    </div>
                    <div class="pdf-download-link">
                        <a href="${dest.file}" target="_blank"><i class='bx bxs-file-pdf'></i> View Full PDF</a>
                    </div>`;
            } else if (dest.type === 'text') {
                contentArea.innerHTML = dest.content;
            }
        } else {
            titleEl.innerHTML = "Destination Not Found";
            priceEl.innerHTML = "";
            contentArea.innerHTML = "<p>Sorry, we couldn't find the itinerary for this destination.</p>";
